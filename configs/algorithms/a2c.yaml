# A2C (Mnih et al., 2016): the synchronous advantage actor-critic baseline.
#
# Defaults for `python -m robotsnap train --config a2c`. On-policy like PPO but
# with several actors, so `n_steps` counts steps per worker and the entropy
# bonus is set twice on purpose: `entropy` is translated by `train` to
# `ent_coef`, and the same value is written out here so the two cannot drift.
algo: a2c
timesteps: 100000
gamma: 0.99
lr: 7.0e-4
hidden: 64
entropy: 0.01
policy_kwargs:
  log_std_init: -0.5
algo_kwargs:
  n_steps: 5
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  gae_lambda: 1.0
seconds: 120.0
control_period: 0.2
pacing: lockstep
time_scale: 1.0
